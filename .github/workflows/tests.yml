name: tests

# Testy z CLAUDE.md w trzech równoległych zadaniach: testy headless (godot), bronie + sieć (weapons) i zrzuty 3D pod xvfb (shots).
# Odpalane na każdym PR i na pushu do main. Wspólne przygotowanie (pliki LFS i import z cache): .github/actions/godot-setup.
on:
  pull_request:
  push:
    branches: [main]

env:
  GODOT_VERSION: 4.7.2

jobs:
  godot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false                       # art_src/ (~560 MB modeli .glb) nie jest potrzebny; pliki gry pobiera godot-setup (z cache)
      - uses: ./.github/actions/godot-setup
        with:
          godot-version: ${{ env.GODOT_VERSION }}
          checks: "true"                   # tex_vram i wagi rękawic: tylko w jednym zadaniu
      - name: Mapy (--maptest)
        run: |
          godot --headless --path prototype -- --maptest --autoquit=4 2>&1 | tee maptest.log
          grep -a "\[MAPTEST\] PASS" maptest.log
      - name: Finał misji 1.1 (--finaletest — zawał, graf nawigacji przygotowany z góry)
        run: |
          godot --headless --path prototype -- --host --mission=z1_m1 --finaletest --autoquit=40 2>&1 | tee finale.log
          grep -a "\[FINALE-TEST\] PASS (0" finale.log
      - name: Stalker (--stalkertest)
        run: |
          godot --headless --path prototype -- --host --stalkertest --autoquit=70 2>&1 | tee stalkertest.log
          grep -a "\[STALKER-TEST\] ==== PASS" stalkertest.log
      - name: Strzelnica FPP (--rangetest)
        run: |
          godot --headless --path prototype -- --host --rangetest --autoquit=60 2>&1 | tee rangetest.log
          grep -a "\[RANGE-TEST\] ==== PASS" rangetest.log
      - name: Wrogowie i hałas (--enemytest)
        run: |
          godot --headless --path prototype -- --host --enemytest --autoquit=150 2>&1 | tee enemytest.log
          grep -a "\[ENEMY-TEST\] ==== PASS" enemytest.log
      - name: Pętla misji i dziennik sesji (--missiontest, --sessionlog)
        run: |
          godot --headless --path prototype -- --host --missiontest --sessionlog="$RUNNER_TEMP/sessions" --autoquit=12 2>&1 | tee missiontest.log
          grep -a "faza=SUCCESS" missiontest.log
          grep -h '"ev":"mission_end"' "$RUNNER_TEMP"/sessions/*.jsonl | grep '"result":"success"' | grep '"scrap":{'
          grep -h '"ev":"pos"' "$RUNNER_TEMP"/sessions/*.jsonl | grep '"who":"P1"'
          grep -h '"ev":"objective"' "$RUNNER_TEMP"/sessions/*.jsonl | grep '"what":"nest"'
          grep -h '"ev":"objective"' "$RUNNER_TEMP"/sessions/*.jsonl | grep '"what":"boss"'
      - name: Przechodzący Stalker w misji 1.1 (--passtest)
        run: |
          godot --headless --path prototype -- --host --mission=z1_m1 --passtest --autoquit=20 2>&1 | tee passtest.log
          grep -a "\[PASS-TEST\] PASS (0" passtest.log
      - name: Droga dźwięku po mapie (test_sound_grid.gd)
        run: |
          godot --headless --path prototype -s tools/test_sound_grid.gd 2>&1 | tee soundgrid.log
          grep -a "\[SOUNDGRID\] PASS" soundgrid.log
      - name: Pętle dźwięku (test_audio_loops.gd)
        run: |
          godot --headless --path prototype -s tools/test_audio_loops.gd 2>&1 | tee audioloops.log
          grep -a "\[AUDIOLOOPS\] PASS" audioloops.log
      - name: Punkty celowania postaci 3D (test_aim_points.gd)
        run: |
          godot --headless --path prototype -s tools/test_aim_points.gd 2>&1 | tee aimpoints.log
          grep -a "^PASS" aimpoints.log
      - name: Sterowanie — konteksty, migracja, menu, HUD i flara
        run: |
          set -o pipefail
          timeout 120 godot --headless --path prototype -s tools/test_input_bindings.gd 2>&1 | tee input-bindings.log
          grep -a "PASS input bindings" input-bindings.log
          ! grep -a -E "SCRIPT ERROR|Parse Error|FAIL input bindings" input-bindings.log
      - name: HUD wyposażonej broni i zestaw czyszczący (test_equipped_ui.gd)
        run: |
          set -o pipefail
          godot --headless --path prototype -s tools/test_equipped_ui.gd 2>&1 | tee equipped-ui.log
          grep -a "PASS equipped UI" equipped-ui.log
          ! grep -a -E "SCRIPT ERROR|Parse Error|FAIL equipped UI" equipped-ui.log
      - name: Faza walki, kilof, podparcie stóp i części broni (test_combat_motion.gd)
        run: |
          godot --headless --path prototype -s tools/test_combat_motion.gd 2>&1 | tee combat-motion.log
          grep -a "PASS combat motion" combat-motion.log
          ! grep -a -E "SCRIPT ERROR|Parse Error|FAIL combat" combat-motion.log
      - name: Kontakt dłoni z bronią (test_weapon_grips.gd)
        run: |
          godot --headless --path prototype -s tools/test_weapon_grips.gd 2>&1 | tee grips.log
          grep -a "^PASS weapon grips" grips.log
      - name: Postój, kolana, podeszwy i przejścia (test_standing_legs.gd)
        run: |
          godot --headless --path prototype -s tools/test_standing_legs.gd 2>&1 | tee standing.log
          grep -a "^PASS standing legs" standing.log
          ! grep -a -E "SCRIPT ERROR|Parse Error|ERROR:|FAIL standing" standing.log
      - name: Animacje wrogów — tempo, podparcie i śmierć
        run: |
          set -o pipefail
          timeout 120 godot --headless --path prototype -s tools/test_enemy_motion.gd 2>&1 | tee enemy-motion.log
          grep -a "^PASS enemy motion" enemy-motion.log
          ! grep -a -E "SCRIPT ERROR|Parse Error|FAIL enemy motion" enemy-motion.log
      - name: Animacje wrogów — obserwator ENet
        run: |
          set -o pipefail
          timeout 30 godot --headless --path prototype -s tools/test_enemy_motion_network.gd -- --motion-server > enemy-motion-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          timeout 30 godot --headless --path prototype -s tools/test_enemy_motion_network.gd -- --motion-client 2>&1 | tee enemy-motion-client.log
          wait "$server_pid"
          grep -a "^PASS enemy motion network" enemy-motion-server.log enemy-motion-client.log
          ! grep -a -E "SCRIPT ERROR|Parse Error|FAIL enemy motion" enemy-motion-server.log enemy-motion-client.log
      - name: Proporcje świata (test_proportions.gd)
        run: |
          godot --headless --path prototype -s tools/test_proportions.gd 2>&1 | tee proportions.log
          grep -a "^PASS" proportions.log
      - name: Konstrukcje 3D (test_structures.gd)
        run: |
          godot --headless --path prototype -s tools/test_structures.gd 2>&1 | tee structures.log
          grep -a "^PASS" structures.log
      - name: Arbiter komunikatów (test_messages.gd)
        run: |
          godot --headless --path prototype -s tools/test_messages.gd 2>&1 | tee messages.log
          grep -a "^PASS" messages.log
      - name: Kontrast notatek (test_note_contrast.gd)
        run: |
          godot --headless --path prototype -s tools/test_note_contrast.gd 2>&1 | tee notecontrast.log
          grep -a "^PASS" notecontrast.log
      - name: Logi testów
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logi-testow
          path: "*.log"
          if-no-files-found: ignore

  weapons:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: ./.github/actions/godot-setup
        with:
          godot-version: ${{ env.GODOT_VERSION }}
      - name: Warsztat — autoryzacja, magazynki, migracja i dostawy
        run: |
          set -o pipefail
          godot --headless --path prototype -- --host --port=8952 --workshoptest --autoquit=60 2>&1 | tee workshop.log
          if grep -a -E "SCRIPT ERROR|Parse Error" workshop.log; then exit 1; fi
          grep -a -E "\[WORKSHOP-TEST\] ==== .*błędów: 0" workshop.log
      - name: Bronie i sieć (test_weapons.sh)
        run: bash prototype/tools/test_weapons.sh
      - name: Logi testów broni
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logi-testow-broni
          path: /tmp/dead_air_weapon_tests/
          if-no-files-found: ignore

  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: ./.github/actions/godot-setup
        with:
          godot-version: ${{ env.GODOT_VERSION }}
      - name: Obraz 3D pod xvfb (zrzut z każdej mapy)
        # Jedyny krok, który wykonuje kod widoku 3D (view3d.gd, level3d.gd, enemy3d.gd, char3d.gd) — testy headless nic nie rysują.
        # Na razie nie blokuje PR-ów: krok nie był jeszcze uruchomiony na runnerze (REVIEW_PLAN.md R7).
        continue-on-error: true
        run: |
          command -v xvfb-run >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq xvfb; }      # obraz runnera zwykle ma już xvfb
          mkdir -p shots
          rc=0
          for m in z1_m1 z1_m2 z1_m3 z1_b1 z1_hub; do
            timeout 120 xvfb-run -a -s "-screen 0 1280x720x24" godot --path prototype --rendering-driver opengl3 -- --host --mission=$m --shot="$PWD/shots/$m.png" > "shots/$m.log" 2>&1 || true
            if grep -a -E "SCRIPT ERROR|Parse Error" "shots/$m.log"; then echo "$m: błąd skryptu"; rc=1; fi
            size=$(stat -c%s "shots/$m.png" 2>/dev/null || echo 0)
            echo "$m: zrzut $size B"
            # jednolity (pusty) kadr 1280x720 kompresuje się do kilku kB; prawdziwa scena ma setki
            if [ "$size" -lt 30000 ]; then echo "$m: brak zrzutu albo pusty kadr"; rc=1; fi
          done
          exit $rc
      - name: Render wyposażonej broni — wspólny cache i zmiana slotu
        run: |
          set -o pipefail
          command -v xvfb-run >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq xvfb; }
          mkdir -p shots
          timeout 120 xvfb-run -a -s "-screen 0 1024x720x24" godot --path prototype --rendering-driver opengl3 -s tools/test_gun_preview_render.gd 2>&1 | tee shots/gun-preview.log
          grep -a "PASS gun preview render" shots/gun-preview.log
          ! grep -a -E "SCRIPT ERROR|Parse Error|FAIL gun preview render" shots/gun-preview.log
      - name: Menu sterowania — widoczność, fokus i polska lokalizacja
        run: |
          set -o pipefail
          command -v xvfb-run >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq xvfb; }
          mkdir -p shots
          timeout 120 xvfb-run -a -s "-screen 0 1280x720x24" godot --path prototype --rendering-driver opengl3 -s tools/test_controls_render.gd -- --controls-shot="$PWD/shots/controls-pl.png" 2>&1 | tee shots/controls.log
          grep -a "PASS controls render" shots/controls.log
          ! grep -a -E "SCRIPT ERROR|Parse Error|FAIL controls render" shots/controls.log
      - name: Zrzuty jako artefakt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zrzuty-3d
          path: shots/
          if-no-files-found: ignore
