name: tests

# Testy headless z CLAUDE.md: mapy (--maptest) oraz bronie + sieć (tools/test_weapons.sh). Odpalane na każdym PR i na pushu do main.
on:
  pull_request:
  push:
    branches: [main]

env:
  GODOT_VERSION: 4.7.2

jobs:
  godot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false                       # art_src/ (~560 MB modeli .glb) nie jest potrzebny; limit transferu LFS jest mały
      - name: Pliki LFS gry (prototype/)
        run: git lfs pull --include="prototype/**"
      - name: Godot ${{ env.GODOT_VERSION }}
        run: |
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          godot --version
      - name: Kompresja VRAM tekstur modeli 3D (tex_vram.py --check)
        run: python3 prototype/tools/tex_vram.py --check
      - name: Import zasobów
        run: godot --headless --path prototype --import
      - name: Mapy (--maptest)
        run: |
          godot --headless --path prototype -- --maptest --autoquit=4 2>&1 | tee maptest.log
          grep -a "\[MAPTEST\] PASS" maptest.log
      - name: Stalker (--stalkertest)
        run: |
          godot --headless --path prototype -- --host --stalkertest --autoquit=70 2>&1 | tee stalkertest.log
          grep -a "\[STALKER-TEST\] ==== PASS" stalkertest.log
      - name: Wrogowie i hałas (--enemytest)
        run: |
          godot --headless --path prototype -- --host --enemytest --autoquit=150 2>&1 | tee enemytest.log
          grep -a "\[ENEMY-TEST\] ==== PASS" enemytest.log
      - name: Pętla misji i dziennik sesji (--missiontest, --sessionlog)
        run: |
          godot --headless --path prototype -- --host --missiontest --sessionlog="$RUNNER_TEMP/sessions" --autoquit=12 2>&1 | tee missiontest.log
          grep -a "faza=SUCCESS" missiontest.log
          grep -h '"ev":"mission_end"' "$RUNNER_TEMP"/sessions/*.jsonl | grep '"result":"success"'
          grep -h '"ev":"pos"' "$RUNNER_TEMP"/sessions/*.jsonl | grep '"who":"P1"'
          grep -h '"ev":"objective"' "$RUNNER_TEMP"/sessions/*.jsonl | grep '"what":"nest"'
          grep -h '"ev":"objective"' "$RUNNER_TEMP"/sessions/*.jsonl | grep '"what":"boss"'
      - name: Przechodzący Stalker w misji 1.1 (--passtest)
        run: |
          godot --headless --path prototype -- --host --mission=z1_m1 --passtest --autoquit=20 2>&1 | tee passtest.log
          grep -a "\[PASS-TEST\] PASS (0" passtest.log
      - name: Droga dźwięku po mapie (test_sound_grid.gd)
        run: |
          godot --headless --path prototype -s tools/test_sound_grid.gd 2>&1 | tee soundgrid.log
          grep -a "\[SOUNDGRID\] PASS" soundgrid.log
      - name: Pętle dźwięku (test_audio_loops.gd)
        run: |
          godot --headless --path prototype -s tools/test_audio_loops.gd 2>&1 | tee audioloops.log
          grep -a "\[AUDIOLOOPS\] PASS" audioloops.log
      - name: Punkty celowania postaci 3D (test_aim_points.gd)
        run: |
          godot --headless --path prototype -s tools/test_aim_points.gd 2>&1 | tee aimpoints.log
          grep -a "^PASS" aimpoints.log
      - name: Proporcje świata (test_proportions.gd)
        run: |
          godot --headless --path prototype -s tools/test_proportions.gd 2>&1 | tee proportions.log
          grep -a "^PASS" proportions.log
      - name: Arbiter komunikatów (test_messages.gd)
        run: |
          godot --headless --path prototype -s tools/test_messages.gd 2>&1 | tee messages.log
          grep -a "^PASS" messages.log
      - name: Kontrast notatek (test_note_contrast.gd)
        run: |
          godot --headless --path prototype -s tools/test_note_contrast.gd 2>&1 | tee notecontrast.log
          grep -a "^PASS" notecontrast.log
      - name: Bronie i sieć (test_weapons.sh)
        run: bash prototype/tools/test_weapons.sh
      - name: Obraz 3D pod xvfb (zrzut z każdej mapy)
        # Jedyny krok, który wykonuje kod widoku 3D (view3d.gd, level3d.gd, enemy3d.gd, char3d.gd) — testy headless nic nie rysują.
        # Na razie nie blokuje PR-ów: krok nie był jeszcze uruchomiony na runnerze (REVIEW_PLAN.md R7).
        continue-on-error: true
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
          mkdir -p shots
          rc=0
          for m in z1_m1 z1_m2 z1_m3 z1_b1 z1_hub; do
            timeout 120 xvfb-run -a -s "-screen 0 1280x720x24" godot --path prototype --rendering-driver opengl3 -- --host --mission=$m --shot="$PWD/shots/$m.png" > "shots/$m.log" 2>&1 || true
            if grep -a -E "SCRIPT ERROR|Parse Error" "shots/$m.log"; then echo "$m: błąd skryptu"; rc=1; fi
            size=$(stat -c%s "shots/$m.png" 2>/dev/null || echo 0)
            echo "$m: zrzut $size B"
            # jednolity (pusty) kadr 1280x720 kompresuje się do kilku kB; prawdziwa scena ma setki
            if [ "$size" -lt 30000 ]; then echo "$m: brak zrzutu albo pusty kadr"; rc=1; fi
          done
          exit $rc
      - name: Zrzuty jako artefakt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zrzuty-3d
          path: shots/
          if-no-files-found: ignore
